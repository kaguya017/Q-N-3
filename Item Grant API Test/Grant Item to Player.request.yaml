$kind: http-request
url: "{{base_url}}/item/grant"
method: POST
headers:
  Authorization: Bearer {{auth_token}}
  Content-Type: application/json
body:
  type: text
  content: '{"playerId": "player_001", "itemId": "potion_small", "amount": 1}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      pm.test('Item grant success is true', function () {
        pm.expect(json.success).to.eql(true);
      });
    language: text/javascript
examples: .resources/Grant Item to Player.resources/examples
order: 1000
